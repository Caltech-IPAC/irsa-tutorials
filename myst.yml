# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: IRSA Tutorials
  subject: IRSA Tutorials
  description: IRSA Python Notebook tutorials to demostrate accessing data served by the NASA/IPAC Infrared Science Archive (IRSA)
  keywords: [astronomy]
  github: https://github.com/Caltech-IPAC/irsa-tutorials/
  copyright: California Institute of Technology
  license:
    id: BSD-3-Clause
    url: https://github.com/Caltech-IPAC/irsa-tutorials/blob/main/LICENSE
  jupyter:
    binder:
      repo: https://github.com/Caltech-IPAC/irsa-tutorials/
      url: https://mybinder.org
  settings:
    output_matplotlib_strings: remove
  error_rules:
     - rule: reference-target-resolves
       severity: error
     - rule: link-resolves
       severity: ignore
       keys:
         # These link resolve in the browser but generates did not resolve and 403 for the build
         - https://irsa.ipac.caltech.edu/cgi-bin/Gator/nph-scan?projshort=SPITZER
         # GH is rather flaky for CI right now, temporarily measure
         - 'https://github.com/**'
  plugins:
    # note: we need to use the built plugin bundle here so make sure to build it with
    # `cd plugins && npm install && npm run build` after any changes to the plugins/src/
    - plugins/dist/notebook-gallery.mjs

extends:
  - toc.yml


# we may want to have a unified sites config file in a cental location, but for now we duplicate the sites config and static files for all the repos.
site:
  template: book-theme
  nav:
    - title: IRSA Tutorials
      url: /.
    - title: Contributed Notebooks
      url: https://irsa.ipac.caltech.edu/irsa-contributed-notebooks/
      open_in_same_tab: true
  options:
    favicon: _static/irsa-favicon.ico
    logo: _static/irsa_logo.png
    style: _static/custom.css
    outline_maxdepth: 1
    # Keep the footer links hidden at least until https://github.com/jupyter-book/mystmd/issues/2589 is resolved
    hide_footer_links: true
